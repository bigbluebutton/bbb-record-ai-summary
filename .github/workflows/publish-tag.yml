name: Cut a new tag

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Version bump type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump-version:
    runs-on: ubuntu-22.04
    outputs:
      new_version: ${{ steps.compute-version.outputs.new_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed to read current tag

      - name: Install devscripts
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts

      - name: Configure Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Compute new version and update debian/changelog
        id: compute-version
        run: |
          set -euo pipefail

          # Read current version from the latest git tag (strip leading 'v')
          CURRENT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          CURRENT_VERSION="${CURRENT_TAG#v}"

          # Split into major.minor.patch
          MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3 | cut -d~ -f1)

          case "${{ github.event.inputs.release_type }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumping $CURRENT_VERSION → $NEW_VERSION"

          # Update debian/changelog
          dch --newversion "$NEW_VERSION" \
              --distribution jammy \
              --force-distribution \
              "Release $NEW_VERSION"

      - name: Commit and tag
        run: |
          set -euo pipefail
          git add debian/changelog
          git commit -m "chore: bump version to ${{ env.NEW_VERSION }}"
          git tag -a "v${{ env.NEW_VERSION }}" -m "v${{ env.NEW_VERSION }}"
          git push --follow-tags

  build-deb-package:
    name: Build Debian package
    needs: bump-version
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for dch_version.sh git describe
          ref: refs/tags/v${{ needs.bump-version.outputs.new_version }}

      - name: Build Debian package
        uses: ./.github/actions/build-deb-package
