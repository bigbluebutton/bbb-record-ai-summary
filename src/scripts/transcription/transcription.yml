# transcription.yml — Configuration for audio transcription back-ends.
#
# Copy this file to transcription.yml (gitignored) and fill in your API key.
# In production, place it alongside transcribe.rb at:
#   /usr/local/bigbluebutton/core/lib/transcription/transcription.yml
#
# Environment variables always take priority over values set here:
#   ALBERT_API_KEY   — Albert API key
#   ALBERT_MODEL     — model name override
#   ALBERT_LANGUAGE  — language override (Albert only)
#   OPENAI_API_KEY   — OpenAI API key
#   OPENAI_LANGUAGE  — language override (OpenAI only)

# Output language as ISO-639-1 code (optional). Shared by all backends.
# Leave blank for auto-detection.
language: "en"

transcriber_path: "disabled"

# Voice Activity Detection — filters out chunks with little or no detected speech
# before sending them to the API.
# Requires node-vad: run  npm install -g node-vad  before enabling.
vad:
  enabled: true

  # Minimum absolute speech duration (ms) a clip must contain to pass VAD.
  # The effective threshold is derived as min_speech_ms / clip_duration_ms,
  # so short clips require a higher speech ratio than long ones.
  min_speech_ms: 150

  # Floor threshold: even for long clips, at least this fraction of 30 ms
  # frames must be classified as VOICE. Prevents long silences from passing.
  speech_threshold: 0.065   # 0.0–1.0

  # Clips longer than this (ms) skip VAD entirely and are always transcribed.
  max_duration_ms: 10000

albert:
  api_key: "your-albert-api-key-here"

  # ASR model to use (optional). Leave blank to let the API choose.
  # Call GET /v1/models to list available automatic-speech-recognition models.
  # model: "openai/whisper-large-v3"

openai:
  api_key: "your-openai-api-key-here"
